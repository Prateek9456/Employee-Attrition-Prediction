<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Attrition AI Platform</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    background: #0b1220;
    color: white;
}

/* TOPBAR */
.topbar {
    height: 60px;
    background: #020617;
    display: flex;
    align-items: center;
    padding: 0 20px;
    justify-content: space-between;
}

/* SIDEBAR */
.sidebar {
    width: 220px;
    height: calc(100vh - 60px);
    position: fixed;
    top: 60px;
    background: #020617;
    padding: 20px;
}

.sidebar div {
    margin: 12px 0;
    opacity: 0.7;
    cursor: pointer;
}
.sidebar div:hover { opacity: 1; }

/* MAIN */
.main {
    margin-left: 240px;
    margin-top: 60px;
    padding: 30px;
}

/* CARD */
.card {
    background: rgba(255,255,255,0.04);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 20px;
    backdrop-filter: blur(15px);
}

/* GRID */
.grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
}

/* INPUT */
input, select {
    width: 100%;
    padding: 8px;
    border-radius: 8px;
    border: none;
    background: #1e293b;
    color: white;
}

label {
    font-size: 12px;
    opacity: 0.7;
}

/* BUTTON */
button {
    margin-top: 20px;
    width: 100%;
    padding: 15px;
    border-radius: 12px;
    border: none;
    background: linear-gradient(90deg, #6366f1, #22c55e);
    font-size: 16px;
    cursor: pointer;
}

/* FLEX */
.flex {
    display: flex;
    gap: 20px;
}

/* CHART */
canvas {
    background: #020617;
    border-radius: 10px;
}
</style>
</head>

<body>

<div class="topbar">
    <h2>🚀 Attrition AI Platform</h2>
</div>

<div class="sidebar">
    <div>Dashboard</div>
    <div>Predictions</div>
    <div>Simulation</div>
    <div>Analytics</div>
</div>

<div class="main">

<!-- BASIC INPUT -->
<div class="card">
<h3>Employee Input</h3>

<div class="grid">
<div><label>Age</label><input id="Age" value="35"></div>
<div><label>Gender</label><select id="Gender"><option>Male</option><option>Female</option></select></div>
<div><label>Marital Status</label><select id="MaritalStatus"><option>Single</option><option>Married</option></select></div>
<div><label>Department</label><select id="Department"><option>Sales</option></select></div>

<div><label>Job Role</label><select id="JobRole"><option>Sales Executive</option></select></div>
<div><label>Job Level</label><input id="JobLevel" value="2"></div>
<div><label>Monthly Income</label><input id="MonthlyIncome" value="5000"></div>
<div><label>Total Working Years</label><input id="TotalWorkingYears" value="10"></div>

<div><label>Years at Company</label><input id="YearsAtCompany" value="5"></div>
<div><label>Years in Role</label><input id="YearsInCurrentRole" value="3"></div>
<div><label>Years Since Promotion</label><input id="YearsSinceLastPromotion" value="1"></div>
<div><label>OverTime</label><select id="OverTime"><option>Yes</option><option>No</option></select></div>

<div><label>Job Satisfaction</label><input id="JobSatisfaction" value="3"></div>
<div><label>Work Life Balance</label><input id="WorkLifeBalance" value="3"></div>
<div><label>Environment Satisfaction</label><input id="EnvironmentSatisfaction" value="3"></div>
<div><label>Relationship Satisfaction</label><input id="RelationshipSatisfaction" value="3"></div>

<div><label>Performance Rating</label><input id="PerformanceRating" value="3"></div>
<div><label>Num Companies</label><input id="NumCompaniesWorked" value="2"></div>
</div>

<button onclick="predict()">🔮 Run Prediction</button>
</div>

<!-- ADVANCED -->
<div class="card">
<h3 onclick="toggleAdvanced()" style="cursor:pointer;">
⚡ Advanced Features (Click)
</h3>

<div id="advancedSection" style="display:none;">
<div class="grid">

<div><label>Daily Rate</label><input id="DailyRate" value="1100"></div>
<div><label>Hourly Rate</label><input id="HourlyRate" value="65"></div>
<div><label>Monthly Rate</label><input id="MonthlyRate" value="15000"></div>
<div><label>Salary Hike %</label><input id="PercentSalaryHike" value="15"></div>

<div><label>Education</label><input id="Education" value="3"></div>
<div><label>Education Field</label><select id="EducationField"><option>Life Sciences</option></select></div>

<div><label>Distance From Home</label><input id="DistanceFromHome" value="5"></div>
<div><label>Job Involvement</label><input id="JobInvolvement" value="3"></div>

<div><label>Stock Option Level</label><input id="StockOptionLevel" value="1"></div>
<div><label>Years With Manager</label><input id="YearsWithCurrManager" value="3"></div>

<div><label>Training Times</label><input id="TrainingTimesLastYear" value="2"></div>
<div><label>Business Travel</label><select id="BusinessTravel"><option>Travel_Rarely</option></select></div>

</div>
</div>
</div>

<!-- OUTPUT -->
<div class="flex">

<div class="card" style="flex:1;">
<h3>Risk Score</h3>
<h2 id="riskText">--</h2>
<canvas id="riskChart"></canvas>
</div>

<div class="card" style="flex:2;">
<h3>Feature Impact</h3>
<canvas id="factorChart"></canvas>
</div>

</div>

</div>

<script>
function toggleAdvanced(){
    const sec = document.getElementById("advancedSection");
    sec.style.display = sec.style.display === "none" ? "block" : "none";
}

let riskChart, factorChart;

async function predict(){

const data = {
Age:+Age.value,
Gender:Gender.value,
MaritalStatus:MaritalStatus.value,
Department:Department.value,
JobRole:JobRole.value,
JobLevel:+JobLevel.value,
MonthlyIncome:+MonthlyIncome.value,
TotalWorkingYears:+TotalWorkingYears.value,
YearsAtCompany:+YearsAtCompany.value,
YearsInCurrentRole:+YearsInCurrentRole.value,
YearsSinceLastPromotion:+YearsSinceLastPromotion.value,
JobSatisfaction:+JobSatisfaction.value,
WorkLifeBalance:+WorkLifeBalance.value,
EnvironmentSatisfaction:+EnvironmentSatisfaction.value,
RelationshipSatisfaction:+RelationshipSatisfaction.value,
OverTime:OverTime.value,
PerformanceRating:+PerformanceRating.value,
NumCompaniesWorked:+NumCompaniesWorked.value,

DailyRate:+DailyRate.value,
HourlyRate:+HourlyRate.value,
MonthlyRate:+MonthlyRate.value,
PercentSalaryHike:+PercentSalaryHike.value,
Education:+Education.value,
EducationField:EducationField.value,
DistanceFromHome:+DistanceFromHome.value,
JobInvolvement:+JobInvolvement.value,
StockOptionLevel:+StockOptionLevel.value,
YearsWithCurrManager:+YearsWithCurrManager.value,
TrainingTimesLastYear:+TrainingTimesLastYear.value,
BusinessTravel:BusinessTravel.value
};

const res = await fetch("http://127.0.0.1:8000/predict",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify(data)
});

const result = await res.json();
const prob = result.attrition_probability;

document.getElementById("riskText").innerText =
(prob*100).toFixed(2)+"%";

/* RISK CHART */
if(riskChart) riskChart.destroy();
riskChart = new Chart(document.getElementById("riskChart"),{
type:'doughnut',
data:{labels:["Risk","Safe"],datasets:[{data:[prob*100,100-prob*100]}]}
});

/* FACTOR CHART */
if(factorChart) factorChart.destroy();
factorChart = new Chart(document.getElementById("factorChart"),{
type:'bar',
data:{
labels: result.top_factors.map(f=>f.feature),
datasets:[{label:"Impact",data: result.top_factors.map(f=>f.impact)}]
}
});
}
</script>

</body>
</html>
